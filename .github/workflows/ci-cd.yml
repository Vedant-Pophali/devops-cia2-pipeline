name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      run: mvn clean install

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      run: az acr login --name vedantdevopsacr

    - name: Build and Push Docker Image
      run: |
        docker build -t vedantdevopsacr.azurecr.io/devops-app:${{ github.sha }} .
        docker push vedantdevopsacr.azurecr.io/devops-app:${{ github.sha }}

    - name: Get AKS Credentials
      run: az aks get-credentials --resource-group devops-cia2-rg --name devops-aks-central --overwrite-existing

    - name: Deploy to AKS
      run: |
        sed -i "s|image: vedantdevopsacr.azurecr.io/devops-app:latest|image: vedantdevopsacr.azurecr.io/devops-app:${{ github.sha }}|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml